<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gratitude Tracker — Find Five</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1> id="title"></h1>
    <p class="description">Write down 5 small things you’re grateful for today.</p>
    <input type="text" id="gratitudeInput" placeholder="I'm grateful for...">
    <button onclick="addGratitude()">Add</button>
    <p id="counterMsg"></p>
    <ul id="todayList"></ul>

    <button class="history-toggle" onclick="toggleHistory()">Show Past Entries</button>
    <div id="history" style="display: none;"></div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
