<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Find Five — Daily Gratitude Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>✨ Find Five ✨</h1>
        <p class="description">Look for at least five things you're grateful for today. Big or small — just real.</p>
        <div class="tracker">
            <input type="text" id="gratitudeInput" placeholder="I'm grateful for...">
            <button onclick="addGratitude()">Add</button>
            <p id="counterMsg"></p>
            <ul id="todayList"></ul>
        </div>
        <div class="history-toggle">
            <button onclick="toggleHistory()">Show Past Entries</button>
            <div id="history" style="display: none;"></div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
